[package]
name = "mercury-wa"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "WhatsApp companion for the Mercury WhatsApp plugin (linked device, via whatsapp-rust)"
license = "MIT"
publish = false

[dependencies]
# Pinned: main @ 2026-10-20. Bump deliberately; the protocol is unofficial.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "c373266fd2c66ae39752171cff5e0dd798a90205" }
tokio = { version = "1.47", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
